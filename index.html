<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kwai Chat Simulator Pro</title>
    <style>
        :root {
            --kwai-orange: #ff5722;
            --kwai-bg: #ffffff;
            --kwai-card: #f7f7f7;
            --kwai-border: #e5e5e5;
            --text-main: #111111;
            --text-muted: #888888;
            --bubble-received: #f1f1f1;
            --bubble-sent: #ffe0d6;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        }

        body {
            background-color: #1a1a1a;
            color: var(--text-main);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 1rem;
        }

        .app-container {
            display: flex;
            gap: 2rem;
            max-width: 1000px;
            width: 100%;
            flex-wrap: wrap;
            justify-content: center;
        }

        /* Simulador do Celular (Fundo Branco igual ao print) */
        .phone-frame {
            width: 380px;
            height: 760px;
            background-color: #ffffff;
            border: 12px solid #222222;
            border-radius: 40px;
            display: flex;
            flex-direction: column;
            overflow: hidden;
            box-shadow: 0 20px 40px rgba(0,0,0,0.6);
            position: relative;
        }

        /* Barra superior do chat */
        .chat-header {
            background-color: #ffffff;
            padding: 12px 16px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            border-bottom: 1px solid var(--kwai-border);
            z-index: 10;
        }

        .header-left {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .back-arrow {
            font-size: 1.4rem;
            cursor: pointer;
            color: #333;
        }

        .header-title {
            font-size: 0.95rem;
            font-weight: 600;
            color: #222;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            max-width: 160px;
        }

        .header-icons {
            display: flex;
            gap: 16px;
            color: #333;
            font-size: 1.2rem;
        }

        /* Corpo do Chat */
        .chat-body {
            flex: 1;
            padding: 16px;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 16px;
            background: #ffffff;
        }

        /* Perfil no topo do chat (conforme a print) */
        .profile-intro {
            text-align: center;
            padding: 20px 0 10px 0;
            border-bottom: 1px solid #f0f0f0;
            margin-bottom: 10px;
        }

        .profile-avatar-large {
            width: 76px;
            height: 76px;
            border-radius: 50%;
            object-fit: cover;
            margin: 0 auto 8px auto;
            display: block;
            border: 1px solid #ddd;
        }

        .profile-stats {
            font-size: 0.85rem;
            font-weight: 600;
            color: #222;
            margin-bottom: 4px;
        }

        .profile-status-text {
            font-size: 0.75rem;
            color: var(--text-muted);
            margin-bottom: 12px;
        }

        .btn-share-profile {
            background-color: transparent;
            border: 1px solid var(--kwai-border);
            padding: 6px 20px;
            border-radius: 16px;
            font-size: 0.8rem;
            color: #333;
            cursor: pointer;
            font-weight: 500;
        }

        .friends-badge {
            text-align: center;
            font-size: 0.7rem;
            color: #999;
            margin: 10px 0;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        /* Estilo das Mensagens */
        .message-row {
            display: flex;
            align-items: flex-start;
            gap: 8px;
            max-width: 85%;
        }

        .message-row.received {
            align-self: flex-start;
        }

        .message-row.sent {
            align-self: flex-end;
            flex-direction: row-reverse;
        }

        .msg-avatar {
            width: 32px;
            height: 32px;
            border-radius: 50%;
            object-fit: cover;
            flex-shrink: 0;
        }

        .message-bubble {
            padding: 10px 14px;
            border-radius: 14px;
            font-size: 0.88rem;
            line-height: 1.4;
            word-break: break-word;
        }

        .message-row.received .message-bubble {
            background-color: var(--bubble-received);
            color: #111;
            border-top-left-radius: 4px;
        }

        .message-row.sent .message-bubble {
            background-color: #ffede6; /* Tom clarinho de laranja para enviadas */
            color: #111;
            border-top-right-radius: 4px;
        }

        /* Rodapé de Digitação (Idêntico ao print) */
        .chat-footer {
            background-color: #ffffff;
            padding: 10px 12px;
            display: flex;
            align-items: center;
            gap: 10px;
            border-top: 1px solid var(--kwai-border);
        }

        .chat-footer input {
            flex: 1;
            background-color: #f4f4f4;
            border: none;
            border-radius: 20px;
            padding: 10px 14px;
            color: #111;
            font-size: 0.88rem;
            outline: none;
        }

        .footer-actions {
            display: flex;
            align-items: center;
            gap: 12px;
            color: #555;
            font-size: 1.25rem;
        }

        .action-icon {
            cursor: pointer;
            transition: color 0.2s;
        }

        .action-icon:hover {
            color: var(--kwai-orange);
        }

        /* Painel de Controle (Editor) */
        .control-panel {
            background-color: #242424;
            border: 1px solid #333;
            border-radius: 16px;
            padding: 20px;
            width: 360px;
            display: flex;
            flex-direction: column;
            gap: 14px;
            color: white;
            max-height: 760px;
            overflow-y: auto;
        }

        .control-panel h2 {
            font-size: 1.1rem;
            color: var(--kwai-orange);
        }

        .form-group {
            display: flex;
            flex-direction: column;
            gap: 5px;
        }

        .form-group label {
            font-size: 0.75rem;
            color: #aaa;
        }

        .form-group input, .form-group select {
            background: #1a1a1a;
            border: 1px solid #444;
            padding: 8px 10px;
            border-radius: 6px;
            color: white;
            font-size: 0.85rem;
            outline: none;
        }

        .form-group input:focus, .form-group select:focus {
            border-color: var(--kwai-orange);
        }

        .btn-action {
            background-color: var(--kwai-orange);
            color: white;
            border: none;
            padding: 10px;
            border-radius: 6px;
            font-weight: 600;
            cursor: pointer;
        }

        .btn-action:hover {
            opacity: 0.9;
        }

        .btn-secondary {
            background-color: #444;
        }
    </style>
</head>
<body>

    <div class="app-container">
        <!-- SIMULADOR DO CELULAR -->
        <div class="phone-frame">
            <!-- Header -->
            <div class="chat-header">
                <div class="header-left">
                    <span class="back-arrow">‹</span>
                    <span class="header-title" id="top-username">🕊️ban(🇧🇷)𝕵e ø ♡</span>
                </div>
                <div class="header-icons">
                    <span>📞</span>
                    <span>⋮</span>
                </div>
            </div>

            <!-- Corpo -->
            <div class="chat-body" id="chat-body">
                <!-- Perfil Inserido Dinamicamente -->
                <div class="profile-intro">
                    <img id="profile-img" src="https://images.unsplash.com/photo-1534528741775-53994a69daeb?w=150" class="profile-avatar-large" alt="Avatar">
                    <div class="profile-stats" id="profile-stats-text">1409 Seguidores • 7 Publicações</div>
                    <div class="profile-status-text">Vocês são amigos agora</div>
                    <button class="btn-share-profile">Compartilhar</button>
                </div>

                <div class="friends-badge">Vocês são amigos agora</div>
                
                <div id="messages-container"></div>
            </div>

            <!-- Rodapé com comportamento dinâmico do microfone -->
            <div class="chat-footer">
                <input type="text" id="chat-input" placeholder="Diga algo" oninput="handleInputChange()">
                <div class="footer-actions">
                    <span class="action-icon">😊</span>
                    <span class="action-icon" id="mic-send-btn" onclick="sendTypedMessage()">🎙️</span>
                    <span class="action-icon">🖼️</span>
                    <span class="action-icon">👍</span>
                </div>
            </div>
        </div>

        <!-- PAINEL DE CONTROLE -->
        <div class="control-panel">
            <h2>⚙️ Painel de Configuração</h2>
            
            <div class="form-group">
                <label>Nome do Contato (Topo)</label>
                <input type="text" id="input-name" value="🕊️ban(🇧🇷)𝕵e ø ♡" oninput="updateProfileInfo()">
            </div>

            <div class="form-group">
                <label>Link da Foto de Perfil</label>
                <input type="text" id="input-avatar" value="https://images.unsplash.com/photo-1534528741775-53994a69daeb?w=150" oninput="updateProfileInfo()">
            </div>

            <div class="form-group">
                <label>Seguidores e Publicações</label>
                <input type="text" id="input-stats" value="1409 Seguidores • 7 Publicações" oninput="updateProfileInfo()">
            </div>

            <hr style="border-color: #333;">

            <div class="form-group">
                <label>Quem vai mandar a próxima mensagem?</label>
                <select id="input-sender-type">
                    <option value="received">Ele/Ela (Aparece do outro lado com foto)</option>
                    <option value="sent">Eu (Aparece do meu lado)</option>
                </select>
            </div>

            <div class="form-group">
                <label>Texto da Mensagem Manual</label>
                <input type="text" id="input-custom-msg" placeholder="Digite uma mensagem para injetar...">
            </div>
            <button class="btn-action" onclick="addManualMessage()">Adicionar Mensagem Manual</button>
            <button class="btn-action btn-secondary" onclick="clearChat()">Limpar Conversa</button>
        </div>
    </div>

    <script>
        const chatInput = document.getElementById('chat-input');
        const micSendBtn = document.getElementById('mic-send-btn');
        const messagesContainer = document.getElementById('messages-container');
        const chatBody = document.getElementById('chat-body');

        let messages = [
            { text: "Olá, sou 🕊️ban(🇧🇷)𝕵e ø ♡, vamos começar o bate-papo.", type: "received" },
            { text: "O vídeo não está disponível porque foi ocultada", type: "received" }
        ];

        // Alterna dinamicamente o microfone 🎙️ para o botão de enviar (➤) quando há texto
        function handleInputChange() {
            if (chatInput.value.trim().length > 0) {
                micSendBtn.textContent = "➤";
            } else {
                micSendBtn.textContent = "🎙️";
            }
        }

        // Função ao clicar no ícone da barra (seja microfone ou enviar)
        function sendTypedMessage() {
            const text = chatInput.value.trim();
            if (!text) return; // Se estiver vazio e clicar no microfone, não faz nada ou simula voz

            const senderType = document.getElementById('input-sender-type').value;

            messages.push({
                text: text,
                type: senderType // 'received' (outro lado) ou 'sent' (meu lado)
            });

            chatInput.value = "";
            handleInputChange();
            renderMessages();
        }

        // Adicionar mensagem rápida pelo painel lateral
        function addManualMessage() {
            const customInput = document.getElementById('input-custom-msg');
            const senderType = document.getElementById('input-sender-type').value;

            if (!customInput.value.trim()) return;

            messages.push({
                text: customInput.value,
                type: senderType
            });

            customInput.value = "";
            renderMessages();
        }

        function updateProfileInfo() {
            const name = document.getElementById('input-name').value;
            const avatarUrl = document.getElementById('input-avatar').value;
            const stats = document.getElementById('input-stats').value;

            document.getElementById('top-username').textContent = name;
            document.getElementById('profile-img').src = avatarUrl;
            document.getElementById('profile-stats-text').textContent = stats;
        }

        function renderMessages() {
            const currentAvatar = document.getElementById('input-avatar').value;

            messagesContainer.innerHTML = messages.map(m => {
                if (m.type === 'received') {
                    return `
                        <div class="message-row received">
                            <img src="${currentAvatar}" class="msg-avatar" alt="Avatar">
                            <div class="message-bubble">${m.text}</div>
                        </div>
                    `;
                } else {
                    return `
                        <div class="message-row sent">
                            <div class="message-bubble">${m.text}</div>
                        </div>
                    `;
                }
            }).join('');

            chatBody.scrollTop = chatBody.scrollHeight;
        }

        function clearChat() {
            messages = [];
            renderMessages();
        }

        // Renderização inicial
        renderMessages();
    </script>
</body>
</html>
