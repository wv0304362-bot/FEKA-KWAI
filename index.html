<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Kwai Chat Tela Cheia</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        }

        html, body {
            height: 100%;
            width: 100%;
            overflow: hidden;
            background-color: #ffffff;
            color: #111111;
        }

        /* Estrutura principal em Flexbox ocupando 100% da tela */
        .phone-frame {
            display: flex;
            flex-direction: column;
            height: 100vh;
            width: 100vw;
            background-color: #ffffff;
            position: relative;
        }

        .simulation-banner {
            background-color: #faf6f2;
            color: #a86c47;
            font-size: 0.65rem;
            text-align: center;
            padding: 4px;
            font-weight: 500;
            letter-spacing: 0.3px;
            flex-shrink: 0;
        }

        .chat-header {
            background-color: #ffffff;
            padding: 10px 16px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            border-bottom: 1px solid #f0f0f0;
            flex-shrink: 0;
            z-index: 10;
        }

        .header-left {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .back-arrow {
            font-size: 1.4rem;
            color: #333;
            cursor: pointer;
        }

        .header-title {
            font-size: 1rem;
            font-weight: 600;
            color: #111;
            max-width: 220px;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
        }

        .header-icons {
            display: flex;
            gap: 18px;
            color: #333;
            font-size: 1.2rem;
            cursor: pointer;
        }

        /* Corpo do chat com rolagem flexível */
        .chat-body {
            flex: 1;
            overflow-y: auto;
            padding: 16px;
            display: flex;
            flex-direction: column;
            gap: 14px;
            background: #ffffff;
            -webkit-overflow-scrolling: touch;
        }

        .profile-intro {
            text-align: center;
            padding: 10px 0;
            border-bottom: 1px solid #f5f5f5;
            margin-bottom: 5px;
        }

        .profile-avatar-large {
            width: 75px;
            height: 75px;
            border-radius: 50%;
            object-fit: cover;
            margin: 0 auto 8px auto;
            display: block;
            background-color: #ff8c53;
            color: white;
            font-size: 1.8rem;
            font-weight: bold;
            line-height: 75px;
            text-align: center;
        }

        .profile-name {
            font-size: 1.05rem;
            font-weight: 700;
            color: #111;
            margin-bottom: 4px;
        }

        .profile-stats {
            font-size: 0.82rem;
            font-weight: 600;
            color: #222;
            margin-bottom: 5px;
        }

        .profile-subtext {
            font-size: 0.73rem;
            color: #888;
            margin-bottom: 2px;
        }

        .btn-share-profile {
            background-color: transparent;
            border: 1px solid #ddd;
            padding: 5px 24px;
            border-radius: 16px;
            font-size: 0.8rem;
            color: #222;
            cursor: pointer;
            font-weight: 500;
            margin-top: 6px;
        }

        .friends-badge {
            text-align: center;
            font-size: 0.72rem;
            color: #999;
            margin: 6px 0;
        }

        .message-row {
            display: flex;
            align-items: flex-start;
            gap: 8px;
            max-width: 85%;
        }

        .message-row.received {
            align-self: flex-start;
        }

        .message-row.sent {
            align-self: flex-end;
            flex-direction: row-reverse;
        }

        .msg-avatar {
            width: 30px;
            height: 30px;
            border-radius: 50%;
            object-fit: cover;
            background-color: #ff8c53;
            color: white;
            font-size: 0.8rem;
            font-weight: bold;
            display: flex;
            align-items: center;
            justify-content: center;
            flex-shrink: 0;
            text-align: center;
            line-height: 30px;
        }

        .message-bubble {
            padding: 10px 14px;
            border-radius: 14px;
            font-size: 0.9rem;
            line-height: 1.4;
            word-break: break-word;
        }

        .message-row.received .message-bubble {
            background-color: #f1f1f1;
            color: #111;
            border-top-left-radius: 3px;
        }

        .message-row.sent .message-bubble {
            background-color: #ffeae1;
            color: #111;
            border-top-right-radius: 3px;
        }

        /* Rodapé fixado na parte inferior por Flexbox (nunca some) */
        .chat-footer {
            background-color: #ffffff;
            padding: 10px 16px;
            display: flex;
            align-items: center;
            gap: 12px;
            border-top: 1px solid #eee;
            flex-shrink: 0;
            width: 100%;
            z-index: 20;
        }

        .chat-footer input {
            flex: 1;
            background-color: #f4f4f4;
            border: none;
            border-radius: 20px;
            padding: 10px 16px;
            color: #111;
            font-size: 0.9rem;
            outline: none;
        }

        .footer-actions {
            display: flex;
            align-items: center;
            gap: 14px;
            color: #444;
            font-size: 1.25rem;
        }

        .action-icon {
            cursor: pointer;
        }

        /* MODAL DE EDIÇÃO */
        .modal-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            background-color: rgba(0, 0, 0, 0.45);
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 100;
            display: none;
        }

        .modal-card {
            background-color: #ffffff;
            width: 90%;
            max-width: 380px;
            border-radius: 20px;
            padding: 20px;
            display: flex;
            flex-direction: column;
            gap: 14px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.25);
            animation: scaleUp 0.2s ease;
        }

        @keyframes scaleUp {
            from { transform: scale(0.9); opacity: 0; }
            to { transform: scale(1); opacity: 1; }
        }

        .modal-header-tag {
            font-size: 0.65rem;
            font-weight: 700;
            color: #b57c5e;
            letter-spacing: 0.5px;
            text-transform: uppercase;
        }

        .modal-title {
            font-size: 1.15rem;
            font-weight: 700;
            color: #111;
            margin-top: -6px;
        }

        .modal-avatar-preview {
            width: 54px;
            height: 54px;
            border-radius: 50%;
            background-color: #ff8c53;
            color: white;
            font-size: 1.3rem;
            font-weight: bold;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            overflow: hidden;
            border: 1px solid #ddd;
        }

        .modal-avatar-preview img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .modal-input-group {
            display: flex;
            flex-direction: column;
            gap: 4px;
        }

        .modal-input-group label {
            font-size: 0.75rem;
            color: #777;
        }

        .modal-input-group input, .modal-input-group select {
            background-color: #f7f7f7;
            border: 1px solid #e5e5e5;
            padding: 10px 12px;
            border-radius: 10px;
            font-size: 0.9rem;
            color: #111;
            outline: none;
        }

        .modal-row {
            display: flex;
            gap: 10px;
        }

        .modal-buttons {
            display: flex;
            gap: 10px;
            margin-top: 6px;
        }

        .btn-modal-cancel {
            flex: 1;
            background-color: transparent;
            border: none;
            color: #333;
            font-weight: 600;
            font-size: 0.9rem;
            padding: 10px;
            cursor: pointer;
        }

        .btn-modal-save {
            flex: 1;
            background-color: #ff5722;
            border: none;
            color: white;
            font-weight: 600;
            font-size: 0.9rem;
            padding: 10px;
            border-radius: 12px;
            cursor: pointer;
        }

        input[type="file"] {
            display: none;
        }
    </style>
</head>
<body>

    <div class="phone-frame">
        <div class="simulation-banner">SIMULAÇÃO · conteúdo fictício</div>

        <div class="chat-header">
            <div class="header-left">
                <span class="back-arrow">‹</span>
                <span class="header-title" id="display-name">Lia Martins</span>
            </div>
            <div class="header-icons">
                <span onclick="openModal()">⋮</span>
            </div>
        </div>

        <div class="chat-body" id="chat-body">
            <div class="profile-intro">
                <div id="display-avatar-container"></div>
                <div class="profile-name" id="display-name-sub">Lia Martins</div>
                <div class="profile-stats" id="display-stats">1091 seguidores · 1 publicação</div>
                <div class="profile-subtext">Você está seguindo @liamartins e mais 10 pessoas</div>
                <div class="profile-subtext">Vocês são amigos agora</div>
                <div class="profile-subtext">Compartilhe este personagem fictício</div>
                <button class="btn-share-profile">Compartilhar</button>
            </div>

            <div class="friends-badge">Vocês são amigos agora</div>
            
            <div id="messages-container" style="display: flex; flex-direction: column; gap: 10px;"></div>
        </div>

        <!-- Rodapé do chat garantido embaixo -->
        <div class="chat-footer">
            <input type="text" id="chat-input" placeholder="Diga algo" oninput="handleInputChange()">
            <div class="footer-actions">
                <span class="action-icon">☺</span>
                <span class="action-icon" id="mic-send-btn" onclick="sendTypedMessage()" title="Enviar mensagem">🎙️</span>
                <span class="action-icon" onclick="document.getElementById('file-chat-img').click()" title="Enviar foto">🖼️</span>
                <span class="action-icon">👍</span>
            </div>
        </div>

        <div class="modal-overlay" id="config-modal">
            <div class="modal-card">
                <div class="modal-header-tag">Personagem Fictício</div>
                <div class="modal-title">Editar personagem</div>

                <div class="modal-avatar-preview" id="modal-avatar-box" onclick="document.getElementById('file-avatar').click()" title="Escolher foto de perfil">
                    <span id="modal-avatar-text">L</span>
                </div>
                <div style="font-size: 0.72rem; color: #666; margin-top: -8px;">Escolher foto de perfil</div>

                <div class="modal-input-group">
                    <label>Nome do Personagem</label>
                    <input type="text" id="input-name" value="Lia Martins">
                </div>

                <div class="modal-input-group">
                    <label>Tipo de Conta</label>
                    <input type="text" id="input-subtext" value="Personagem fictício">
                </div>

                <div class="modal-row">
                    <div class="modal-input-group">
                        <label>Seguidores</label>
                        <input type="number" id="input-followers" value="1091">
                    </div>
                    <div class="modal-input-group">
                        <label>Publicações</label>
                        <input type="number" id="input-posts" value="1">
                    </div>
                </div>

                <div class="modal-input-group">
                    <label>Enviar próxima mensagem como:</label>
                    <select id="input-sender-type">
                        <option value="received">Outro lado (Personagem)</option>
                        <option value="sent">Meu lado (Eu)</option>
                    </select>
                </div>

                <div class="modal-buttons">
                    <button class="btn-modal-cancel" onclick="closeModal()">Cancelar</button>
                    <button class="btn-modal-save" onclick="saveModal()">Salvar</button>
                </div>
            </div>
        </div>
    </div>

    <input type="file" id="file-avatar" accept="image/*" onchange="loadAvatarImage(event)">
    <input type="file" id="file-chat-img" accept="image/*" onchange="sendGalleryImage(event)">

    <script>
        let profileData = {
            name: "Lia Martins",
            subtext: "Personagem fictício",
            followers: 1091,
            posts: 1,
            image: null
        };

        let messages = [
            { text: "Olá, sou Lia. vamos começar o bate-papo.", type: "received", isImg: false }
        ];

        const chatInput = document.getElementById('chat-input');
        const micSendBtn = document.getElementById('mic-send-btn');
        const messagesContainer = document.getElementById('messages-container');
        const chatBody = document.getElementById('chat-body');

        function openModal() {
            document.getElementById('config-modal').style.display = 'flex';
            document.getElementById('input-name').value = profileData.name;
            document.getElementById('input-subtext').value = profileData.subtext;
            document.getElementById('input-followers').value = profileData.followers;
            document.getElementById('input-posts').value = profileData.posts;
        }

        function closeModal() {
            document.getElementById('config-modal').style.display = 'none';
        }

        function saveModal() {
            profileData.name = document.getElementById('input-name').value;
            profileData.subtext = document.getElementById('input-subtext').value;
            profileData.followers = document.getElementById('input-followers').value;
            profileData.posts = document.getElementById('input-posts').value;

            updateProfileUI();
            closeModal();
        }

        function updateProfileUI() {
            document.getElementById('display-name').textContent = profileData.name;
            document.getElementById('display-name-sub').textContent = profileData.name;
            document.getElementById('display-stats').textContent = `${profileData.followers} seguidores · ${profileData.posts} publicação`;

            const avatarContainer = document.getElementById('display-avatar-container');
            const modalAvatarBox = document.getElementById('modal-avatar-box');

            if (profileData.image) {
                avatarContainer.innerHTML = `<img src="${profileData.image}" class="profile-avatar-large">`;
                modalAvatarBox.innerHTML = `<img src="${profileData.image}">`;
            } else {
                const initial = profileData.name.charAt(0).toUpperCase();
                avatarContainer.innerHTML = `<div class="profile-avatar-large">${initial}</div>`;
                modalAvatarBox.innerHTML = `<span id="modal-avatar-text">${initial}</span>`;
            }
            renderMessages();
        }

        function loadAvatarImage(event) {
            const file = event.target.files[0];
            if (file) {
                const reader = new FileReader();
                reader.onload = function(e) {
                    profileData.image = e.target.result;
                    const modalAvatarBox = document.getElementById('modal-avatar-box');
                    modalAvatarBox.innerHTML = `<img src="${profileData.image}">`;
                }
                reader.readAsDataURL(file);
            }
        }

        function handleInputChange() {
            if (chatInput.value.trim().length > 0) {
                micSendBtn.textContent = "➤";
            } else {
                micSendBtn.textContent = "🎙️";
            }
        }

        function sendTypedMessage() {
            const text = chatInput.value.trim();
            if (!text) return;

            const senderType = document.getElementById('input-sender-type').value;
            messages.push({ text: text, type: senderType, isImg: false });

            chatInput.value = "";
            handleInputChange();
            renderMessages();
        }

        function sendGalleryImage(event) {
            const file = event.target.files[0];
            if (file) {
                const reader = new FileReader();
                reader.onload = function(e) {
                    const senderType = document.getElementById('input-sender-type').value;
                    messages.push({ text: e.target.result, type: senderType, isImg: true });
                    renderMessages();
                }
                reader.readAsDataURL(file);
            }
        }

        function renderMessages() {
            messagesContainer.innerHTML = messages.map(m => {
                let content = m.isImg ? `<img src="${m.text}" style="max-width: 180px; border-radius: 8px; display: block;">` : m.text;

                if (m.type === 'received') {
                    let avatarHTML = profileData.image 
                        ? `<img src="${profileData.image}" class="msg-avatar">`
                        : `<div class="msg-avatar">${profileData.name.charAt(0).toUpperCase()}</div>`;

                    return `
                        <div class="message-row received">
                            ${avatarHTML}
                            <div class="message-bubble">${content}</div>
                        </div>
                    `;
                } else {
                    return `
                        <div class="message-row sent">
                            <div class="message-bubble">${content}</div>
                        </div>
                    `;
                }
            }).join('');

            chatBody.scrollTop = chatBody.scrollHeight;
        }

        updateProfileUI();
    </script>
</body>
</html>
