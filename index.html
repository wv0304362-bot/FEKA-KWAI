<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kwai Chat Real</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        }

        body {
            background-color: #121212;
            color: #111111;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
            padding: 10px;
        }

        .main-wrapper {
            max-width: 420px;
            width: 100%;
            display: flex;
            flex-direction: column;
            gap: 15px;
        }

        /* Simulador do Celular */
        .phone-frame {
            width: 100%;
            height: 700px;
            background-color: #ffffff;
            border: 8px solid #222222;
            border-radius: 36px;
            display: flex;
            flex-direction: column;
            overflow: hidden;
            box-shadow: 0 15px 35px rgba(0,0,0,0.5);
            position: relative;
        }

        /* Barra Superior */
        .chat-header {
            background-color: #ffffff;
            padding: 10px 14px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            border-bottom: 1px solid #f0f0f0;
            z-index: 10;
        }

        .header-left {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .back-arrow {
            font-size: 1.3rem;
            color: #333;
            cursor: pointer;
        }

        .header-title {
            font-size: 0.9rem;
            font-weight: 600;
            color: #111;
            max-width: 180px;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
        }

        .header-icons {
            display: flex;
            gap: 14px;
            color: #333;
            font-size: 1.1rem;
        }

        /* Corpo do Chat */
        .chat-body {
            flex: 1;
            padding: 14px;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 14px;
            background: #ffffff;
        }

        /* Seção de Perfil no Topo (Idêntica à Print) */
        .profile-intro {
            text-align: center;
            padding: 10px 0 10px 0;
            border-bottom: 1px solid #f5f5f5;
            margin-bottom: 5px;
        }

        .profile-avatar-container {
            position: relative;
            width: 72px;
            height: 72px;
            margin: 0 auto 6px auto;
            cursor: pointer;
        }

        .profile-avatar-large {
            width: 100%;
            height: 100%;
            border-radius: 50%;
            object-fit: cover;
            border: 1px solid #ccc;
        }

        .edit-overlay-icon {
            position: absolute;
            bottom: 0;
            right: 0;
            background: #ff5722;
            color: white;
            border-radius: 50%;
            width: 22px;
            height: 22px;
            font-size: 11px;
            display: flex;
            align-items: center;
            justify-content: center;
            border: 2px solid white;
        }

        .profile-stats {
            font-size: 0.8rem;
            font-weight: 700;
            color: #222;
            margin-bottom: 3px;
        }

        .profile-status-text {
            font-size: 0.72rem;
            color: #888;
            margin-bottom: 8px;
        }

        .btn-share-profile {
            background-color: transparent;
            border: 1px solid #ddd;
            padding: 4px 16px;
            border-radius: 14px;
            font-size: 0.75rem;
            color: #333;
            cursor: pointer;
            font-weight: 500;
        }

        .friends-badge {
            text-align: center;
            font-size: 0.68rem;
            color: #aaa;
            margin: 6px 0;
            text-transform: uppercase;
        }

        /* Mensagens */
        .message-row {
            display: flex;
            align-items: flex-start;
            gap: 8px;
            max-width: 88%;
        }

        .message-row.received {
            align-self: flex-start;
        }

        .message-row.sent {
            align-self: flex-end;
            flex-direction: row-reverse;
        }

        .msg-avatar {
            width: 28px;
            height: 28px;
            border-radius: 50%;
            object-fit: cover;
            flex-shrink: 0;
        }

        .message-bubble {
            padding: 9px 12px;
            border-radius: 12px;
            font-size: 0.85rem;
            line-height: 1.35;
            word-break: break-word;
        }

        .message-row.received .message-bubble {
            background-color: #f1f1f1;
            color: #111;
            border-top-left-radius: 3px;
        }

        .message-row.sent .message-bubble {
            background-color: #fcece9;
            color: #111;
            border-top-right-radius: 3px;
        }

        /* Rodapé igualzinho ao Kwai */
        .chat-footer {
            background-color: #ffffff;
            padding: 8px 10px;
            display: flex;
            align-items: center;
            gap: 8px;
            border-top: 1px solid #eee;
        }

        .chat-footer input {
            flex: 1;
            background-color: #f4f4f4;
            border: none;
            border-radius: 18px;
            padding: 8px 12px;
            color: #111;
            font-size: 0.85rem;
            outline: none;
        }

        .footer-actions {
            display: flex;
            align-items: center;
            gap: 10px;
            color: #555;
            font-size: 1.15rem;
        }

        .action-icon {
            cursor: pointer;
        }

        /* Painel de Configuração Compacto Abaixo */
        .config-panel {
            background-color: #1e1e1e;
            border: 1px solid #333;
            border-radius: 16px;
            padding: 14px;
            color: white;
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .config-panel h3 {
            font-size: 0.95rem;
            color: #ff5722;
        }

        .form-row {
            display: flex;
            gap: 8px;
        }

        .form-group {
            flex: 1;
            display: flex;
            flex-direction: column;
            gap: 3px;
        }

        .form-group label {
            font-size: 0.7rem;
            color: #aaa;
        }

        .form-group input, .form-group select {
            background: #2a2a2a;
            border: 1px solid #444;
            padding: 6px 8px;
            border-radius: 6px;
            color: white;
            font-size: 0.8rem;
            outline: none;
        }

        .btn-main {
            background-color: #ff5722;
            color: white;
            border: none;
            padding: 8px;
            border-radius: 6px;
            font-weight: 600;
            font-size: 0.85rem;
            cursor: pointer;
            text-align: center;
        }

        /* Inputs ocultos de arquivos da galeria */
        input[type="file"] {
            display: none;
        }
    </style>
</head>
<body>

    <div class="main-wrapper">
        <!-- SIMULADOR DO CELULAR -->
        <div class="phone-frame">
            <!-- Header -->
            <div class="chat-header">
                <div class="header-left">
                    <span class="back-arrow">‹</span>
                    <span class="header-title" id="top-username">🕊️ban(🇧🇷)𝕵e ø ♡</span>
                </div>
                <div class="header-icons">
                    <span>📞</span>
                    <span>⋮</span>
                </div>
            </div>

            <!-- Corpo -->
            <div class="chat-body" id="chat-body">
                <!-- Perfil no Topo -->
                <div class="profile-intro">
                    <div class="profile-avatar-container" onclick="document.getElementById('file-profile').click()">
                        <img id="profile-img" src="https://images.unsplash.com/photo-1534528741775-53994a69daeb?w=150" class="profile-avatar-large" alt="Avatar">
                        <div class="edit-overlay-icon">📷</div>
                    </div>
                    <div class="profile-stats" id="profile-stats-text">1409 Seguidores • 7 Publicações</div>
                    <div class="profile-status-text">Vocês são amigos agora</div>
                    <button class="btn-share-profile">Compartilhar</button>
                </div>

                <div class="friends-badge">Vocês são amigos agora</div>
                
                <div id="messages-container" style="display: flex; flex-direction: column; gap: 10px;"></div>
            </div>

            <!-- Rodapé (Comportamento exato do microfone/enviar) -->
            <div class="chat-footer">
                <input type="text" id="chat-input" placeholder="Diga algo" oninput="handleInputChange()">
                <div class="footer-actions">
                    <span class="action-icon" id="mic-send-btn" onclick="sendTypedMessage()">🎙️</span>
                    <span class="action-icon" onclick="document.getElementById('file-gallery').click()">🖼️</span>
                    <span class="action-icon">👍</span>
                </div>
            </div>
        </div>

        <!-- PAINEL DE CONTROLE ABAIXO -->
        <div class="config-panel">
            <h3>⚙️ Configurar Chat</h3>
            
            <div class="form-row">
                <div class="form-group">
                    <label>Nome do Perfil</label>
                    <input type="text" id="input-name" value="🕊️ban(🇧🇷)𝕵e ø ♡" oninput="updateProfileInfo()">
                </div>
                <div class="form-group">
                    <label>Seguidores & Pubs</label>
                    <input type="text" id="input-stats" value="1409 Seguidores • 7 Publicações" oninput="updateProfileInfo()">
                </div>
            </div>

            <div class="form-row">
                <div class="form-group">
                    <label>Enviar próxima mensagem como:</label>
                    <select id="input-sender-type">
                        <option value="received">Outro lado (Com foto)</option>
                        <option value="sent">Meu lado (Enviada)</option>
                    </select>
                </div>
            </div>

            <button class="btn-main" onclick="clearChat()">Limpar Conversa</button>
        </div>
    </div>

    <!-- Inputs ocultos para carregar direto da galeria -->
    <input type="file" id="file-profile" accept="image/*" onchange="loadProfileImage(event)">
    <input type="file" id="file-gallery" accept="image/*" onchange="sendImageMessage(event)">

    <script>
        const chatInput = document.getElementById('chat-input');
        const micSendBtn = document.getElementById('mic-send-btn');
        const messagesContainer = document.getElementById('messages-container');
        const chatBody = document.getElementById('chat-body');

        let messages = [
            { text: "Olá, sou 🕊️ban(🇧🇷)𝕵e ø ♡, vamos começar o bate-papo.", type: "received", isImg: false },
            { text: "O vídeo não está disponível porque foi ocultada", type: "received", isImg: false }
        ];

        let currentProfileImage = "https://images.unsplash.com/photo-1534528741775-53994a69daeb?w=150";

        // Troca o microfone para seta quando digita
        function handleInputChange() {
            if (chatInput.value.trim().length > 0) {
                micSendBtn.textContent = "➤";
            } else {
                micSendBtn.textContent = "🎙️";
            }
        }

        // Envia mensagem digitada
        function sendTypedMessage() {
            const text = chatInput.value.trim();
            if (!text) return;

            const senderType = document.getElementById('input-sender-type').value;

            messages.push({
                text: text,
                type: senderType,
                isImg: false
            });

            chatInput.value = "";
            handleInputChange();
            renderMessages();
        }

        // Carrega foto de perfil direto da galeria do celular
        function loadProfileImage(event) {
            const file = event.target.files[0];
            if (file) {
                const reader = new FileReader();
                reader.onload = function(e) {
                    currentProfileImage = e.target.result;
                    document.getElementById('profile-img').src = currentProfileImage;
                    renderMessages();
                }
                reader.readAsDataURL(file);
            }
        }

        // Envia imagem direto da galeria como mensagem no chat
        function sendImageMessage(event) {
            const file = event.target.files[0];
            if (file) {
                const reader = new FileReader();
                reader.onload = function(e) {
                    const senderType = document.getElementById('input-sender-type').value;
                    messages.push({
                        text: e.target.result,
                        type: senderType,
                        isImg: true
                    });
                    renderMessages();
                }
                reader.readAsDataURL(file);
            }
        }

        function updateProfileInfo() {
            const name = document.getElementById('input-name').value;
            const stats = document.getElementById('input-stats').value;

            document.getElementById('top-username').textContent = name;
            document.getElementById('profile-stats-text').textContent = stats;
        }

        function renderMessages() {
            messagesContainer.innerHTML = messages.map(m => {
                let content = m.isImg ? `<img src="${m.text}" style="max-width: 160px; border-radius: 8px; display: block;">` : m.text;

                if (m.type === 'received') {
                    return `
                        <div class="message-row received">
                            <img src="${currentProfileImage}" class="msg-avatar" alt="Avatar">
                            <div class="message-bubble">${content}</div>
                        </div>
                    `;
                } else {
                    return `
                        <div class="message-row sent">
                            <div class="message-bubble">${content}</div>
                        </div>
                    `;
                }
            }).join('');

            chatBody.scrollTop = chatBody.scrollHeight;
        }

        function clearChat() {
            messages = [];
            renderMessages();
        }

        renderMessages();
    </script>
</body>
</html>
